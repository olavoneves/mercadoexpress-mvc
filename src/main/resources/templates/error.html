<!DOCTYPE html>
<!-- Fallback para qualquer status sem template proprio (500, 503...). -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Algo deu errado')}"></head>
<body>

<header th:replace="~{fragments/layout :: topo('erro')}"></header>

<main class="conteudo">
    <div class="envelope">
        <section class="recado">
            <p class="recado__codigo" th:text="${status} ?: '500'">500</p>
            <h1>O caixa travou por aqui</h1>
            <p>
                A aplicacao nao conseguiu concluir essa operacao. Tente de novo em instantes
                ou volte para a vitrine.
            </p>
            <p>
                <a class="botao" th:href="@{/}">Voltar para a vitrine</a>
            </p>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
