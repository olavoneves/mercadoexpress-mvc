spring.application.name=mercado-express-mvc

# Porta da Parte II: 8080.
# A Parte I (API REST) roda na 8082, entao as duas sobem juntas na mesma maquina.
# A variavel PORT so existe para o container do Render; localmente cai no default.
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Perfil default: Oracle da FIAP (o MESMO banco da Parte I)
# As credenciais NUNCA vao para o repositorio: use variaveis de ambiente
# (veja o arquivo .env.example na raiz do projeto).
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# A tabela e a sequence sao criadas pelo database/script.sql, nunca pelo Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Formularios enviam POST com _method=delete? Nao usamos: as rotas de
# exclusao sao POST puras, o que dispensa o HiddenHttpMethodFilter.

# Atras do proxy do Render: respeita X-Forwarded-Proto/Host, para que os
# redirects sejam gerados em https e com o host publico correto.
server.forward-headers-strategy=framework

# Erros 404/403 caem nos templates de error/, nunca no Whitelabel.
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
