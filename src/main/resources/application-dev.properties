# ---------------------------------------------------------------
# Perfil dev: H2 em memoria.
# Serve para rodar a aplicacao sem VPN/credencial da FIAP e como
# fallback do deploy, caso o Oracle recuse conexao de IP externo.
# Ativar com: --spring.profiles.active=dev
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:mercadoexpressmvc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# A massa de teste roda depois de o Hibernate criar tabela e sequence
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data-dev.sql
spring.jpa.defer-datasource-initialization=true

# Sem cache de template: editar o HTML e dar F5 basta
spring.thymeleaf.cache=false

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
